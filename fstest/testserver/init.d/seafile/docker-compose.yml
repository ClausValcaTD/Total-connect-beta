version: '3.8'

services:
  tc-server:
    build: .
    container_name: totalconnect-server
    ports:
      - "50051:50051"
    volumes:
      - tc-vault:/root/.totalconnect/vault
      - tc-config:/root/.totalconnect
    environment:
      - TC_LOG_LEVEL=INFO
    restart: unless-stopped

  # Optional: Run TUI from host, not container
  # tc-cli:
  #   build: .
  #   container_name: totalconnect-cli
  #   command: ./tc-cli
  #   network_mode: host
  #   depends_on:
  #     - tc-server

volumes:
  tc-vault:
  tc-config:
